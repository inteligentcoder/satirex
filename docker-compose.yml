services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-satire}
      MARIADB_USER: ${MARIADB_USER:-satire}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-satire}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-satire}:${MARIADB_PASSWORD:-satire}@db:3306/${MARIADB_DATABASE:-satire}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@satirex.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      VIDEO_CODEC: ${VIDEO_CODEC:-auto}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # URL the browser uses to reach the backend (published backend port).
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads:
